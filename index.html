<!DOCTYPE html>
<html>
<head>
  <style>
    /* This is CSS - It styles your page */
    body {
      background-color: #1a1a2e; /* Sleek dark blue background */
      color: #ffffff;            /* White text color */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    button {
      background-color: #e94560; /* Vibrant pink/red button */
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0px 4px 15px rgba(233, 69, 96, 0.4);
    }

    button:hover {
      background-color: #ff5e7e; /* Brightens up when you hover */
    }
  </style>
</head>
<body>

  <h1>Welcome to Version 3.0! 🎨</h1>
  <p>You successfully deployed a styled, interactive web app.</p>
  
  <!-- This is the button template -->
  <button onclick="showAlert()">Click Me!</button>

<h1>my-first-web-app</h1>
<p> Learning to build web application can help me build more innovative apps.</p>

<h1> Let's Build!! </h1>
<button> Yes I want to build </button>

  
  <script>
    /* This is JavaScript - It makes the button work */
    function showAlert() {
      alert("Congratulations! Your interactive deployed app works perfectly! 🎉");
    }
  </script>

</body>
</html>
